 {% extends "base.html" %}

{% block content %}
    <div class="row">
        <div class="col-md-8 offset-2">
        <h4 class="alert alert-info">Update Student Information</h4>
        <form action="" method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="mb-3">
                    <label class="form-label fw-bold">Name:</label>
                    <input type="text"
                           name="name"
                           value="{{ employee.name }}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email:</label>
                    <input type="email"
                           name="email"
                           value="{{ employee.email }}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Department:</label>
                    <input type="text"
                           name="department"
                           value="{{ employee.department }}"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Salary:</label>
                    <input type="number"
                           name="salary"
                           value="{{ employee.salary }}"
                           class="form-control">
                </div>

                <button class="btn btn-success">Update</button>
                <a href="{% url 'addandshow' %}"
                   class="btn btn-info">Back to Home</a>
        </form>
    </div>
{% endblock content %}
